<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CargoFit Layout QA</title><style>body{margin:0;background:#e2e8f0;font:14px system-ui;color:#0f172a}header{padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:white}select,button{font:inherit;padding:8px}#stage{margin:16px auto;position:relative}iframe{border:0;display:block;transform-origin:top left;background:white}output{font-variant-numeric:tabular-nums}a{color:#0f766e}</style><header><strong>Layout QA · Real Frame Viewport</strong><label>Viewport <select id="size"><option value="1440,900">1440 × 900</option><option value="1280,800">1280 × 800</option><option value="768,1024">768 × 1024</option><option value="390,844">390 × 844</option></select></label><label><input id="fit" type="checkbox" checked> Fit preview</label><button id="reload">Reload App</button><output id="dimensions"></output><a href="/" target="_blank">Open App</a><button id="measure">Measure Layout</button><output id="checks"></output></header><div id="stage"><iframe id="app" title="CargoFit Test Viewport" src="/layout-qa-app.html"></iframe></div><script>const size=document.querySelector('#size'),fit=document.querySelector('#fit'),frame=document.querySelector('#app'),stage=document.querySelector('#stage');function layout(){const [w,h]=size.value.split(',').map(Number),scale=fit.checked?Math.min(1,(document.documentElement.clientWidth-32)/w):1;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';document.querySelector('#dimensions').textContent=w+' × '+h+' CSS px · Preview '+Math.round(scale*100)+'%';}size.addEventListener('change',layout);fit.addEventListener('change',layout);window.addEventListener('resize',layout);document.querySelector('#reload').addEventListener('click',()=>{frame.src='/layout-qa-app.html';});document.querySelector('#measure').addEventListener('click',()=>{const d=frame.contentDocument,e=d.documentElement,t=d.querySelector('.product-table-wrap'),form=d.querySelector('.wizard-page');document.querySelector('#checks').textContent=JSON.stringify({viewport:[frame.contentWindow.innerWidth,frame.contentWindow.innerHeight],page:[e.clientWidth,e.scrollWidth],table:t?[t.clientWidth,t.scrollWidth]:null,form:form?.getBoundingClientRect().width});});layout();</script></html>
