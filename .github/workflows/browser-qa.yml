name: Browser QA evidence
on:
  pull_request:
  push:
    branches: ["qa/cargofit-v1-neon-20261126"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Static export smoke and screenshot evidence
        run: |
          node scripts/qa-serve.mjs > /tmp/cargofit-qa-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          QA_BASE_URL=http://127.0.0.1:4173 node scripts/qa-browser.mjs
      - name: Upload screenshots and per-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargofit-browser-evidence
          path: outputs/browser-qa/
          if-no-files-found: warn
          retention-days: 14
